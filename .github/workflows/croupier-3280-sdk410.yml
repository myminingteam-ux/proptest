name: Croupier v3.1.0 for HITMAN 3.280 / SDK 4.1.0

on:
  push:
    branches: [croupier-3280-sdk410]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, load-hook-disabled]
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout official Croupier v3.1.0 source
        uses: actions/checkout@v4
        with:
          repository: Deji69/Croupier
          ref: 742efac01ff26d96f337aa3fc693dd57b8f1d885
          path: src
          fetch-depth: 1

      - name: Setup Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Apply SDK 4.1.0 compatibility patch
        shell: pwsh
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          @'
          from pathlib import Path
          import os
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label}, found {count}")
              return text.replace(old, new)

          root = Path.cwd()
          shim = root / "compat-include"
          shim.mkdir(exist_ok=True)
          (shim / "implot.h").write_text(
              "#pragma once\n"
              "struct ImPlotContext;\n"
              "namespace ImPlot { inline void SetCurrentContext(ImPlotContext*) noexcept {} }\n",
              encoding="ascii",
          )

          cmake = Path("src/mod/CMakeLists.txt")
          cm = cmake.read_text(encoding="utf-8-sig")
          cm = replace_once(
              cm,
              'set(ZHMMODSDK_VER "v4.0.2")',
              'set(ZHMMODSDK_VER "v4.1.0")',
              "official SDK version declaration",
          )
          marker = "target_compile_options(Croupier PRIVATE -utf-8)"
          shim_path = shim.resolve().as_posix()
          cm = replace_once(
              cm,
              marker,
              marker
              + "\n"
              + "target_compile_definitions(Croupier PRIVATE NOMINMAX)\n"
              + f'target_include_directories(Croupier PRIVATE "{shim_path}")',
              "Croupier compile-options marker",
          )
          cmake.write_text(cm, encoding="utf-8", newline="\n")

          if os.environ["BUILD_VARIANT"] == "load-hook-disabled":
              cpp_path = Path("src/mod/src/Croupier.cpp")
              cpp = cpp_path.read_text(encoding="utf-8")
              for old, label in [
                  (
                      "\tHooks::ZLoadingScreenVideo_ActivateLoadingScreen->AddDetour(this, &CroupierPlugin::OnLoadingScreenActivated);\n",
                      "loading-screen detour installation",
                  ),
                  (
                      "\tHooks::ZLoadingScreenVideo_ActivateLoadingScreen->RemoveDetour(&CroupierPlugin::OnLoadingScreenActivated);\n",
                      "loading-screen detour removal",
                  ),
                  ("\tthis->ProcessLoadRemoval();\n", "per-frame load-removal call"),
              ]:
                  cpp = replace_once(cpp, old, "", label)

              cpp, count = re.subn(
                  r"auto CroupierPlugin::ProcessLoadRemoval\(\) -> void \{.*?\n\}\n\n(?=auto CroupierPlugin::ProcessMissionsMessage)",
                  "",
                  cpp,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"Expected one ProcessLoadRemoval definition, found {count}")

              cpp, count = re.subn(
                  r"DEFINE_PLUGIN_DETOUR\(CroupierPlugin, void\*, OnLoadingScreenActivated, void\* th, void\* a1\) \{.*?\n\}\n\n(?=DEFINE_PLUGIN_DETOUR\(CroupierPlugin, void, OnEventReceived)",
                  "",
                  cpp,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"Expected one loading-screen detour definition, found {count}")
              cpp_path.write_text(cpp, encoding="utf-8", newline="\n")

              header_path = Path("src/mod/src/Croupier.h")
              header = header_path.read_text(encoding="utf-8")
              for old, label in [
                  ("\t\tauto ProcessLoadRemoval() -> void;\n", "ProcessLoadRemoval declaration"),
                  (
                      "\t\tDECLARE_PLUGIN_DETOUR(CroupierPlugin, void*, OnLoadingScreenActivated, void* th, void* a1);\n",
                      "loading-screen detour declaration",
                  ),
                  ("\t\tbool loadRemovalActive = false;\n", "load-removal state"),
                  ("\t\tbool isLoadingScreenCheckHasBeenTrue = false;\n", "loading-screen check state"),
                  ("\t\tbool loadingScreenActivated = false;\n", "loading-screen activation state"),
              ]:
                  header = replace_once(header, old, "", label)
              header_path.write_text(header, encoding="utf-8", newline="\n")

              app_cpp_path = Path("src/mod/src/App.cpp")
              app_cpp = app_cpp_path.read_text(encoding="utf-8")
              app_cpp, count = re.subn(
                  r"auto Croupier::SendLoadStarted\(\) -> void \{.*?\n\}\n\nauto Croupier::SendLoadFinished\(\) -> void \{.*?\n\}\n\n",
                  "",
                  app_cpp,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"Expected one load-message function pair, found {count}")
              app_cpp_path.write_text(app_cpp, encoding="utf-8", newline="\n")

              app_h_path = Path("src/mod/src/App.h")
              app_h = app_h_path.read_text(encoding="utf-8")
              for old, label in [
                  ("\textern auto SendLoadStarted() -> void;\n", "SendLoadStarted declaration"),
                  ("\textern auto SendLoadFinished() -> void;\n", "SendLoadFinished declaration"),
              ]:
                  app_h = replace_once(app_h, old, "", label)
              app_h_path.write_text(app_h, encoding="utf-8", newline="\n")

          croupier_cpp = Path("src/mod/src/Croupier.cpp").read_text(encoding="utf-8")
          required = [
              "Globals::ActorManager->m_aActors[i]",
              "actorRef.m_entityRef.QueryInterface<ZRepositoryItemEntity>()",
              "actor.m_bContractTarget",
              "Functions::ZDynamicObject_ToString->Call(const_cast<ZDynamicObject*>(&obj), res);",
          ]
          for token in required:
              if token not in croupier_cpp:
                  raise SystemExit(f"Expected v3.1.0 SDK-compatible source token: {token}")
          '@ | python -

      - name: Build native mod against official ZHMModSDK v4.1.0
        shell: pwsh
        run: |
          cmake -S src/mod -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --parallel
          cmake --install build --prefix stage
          if (-not (Test-Path -LiteralPath 'stage/bin/Croupier.dll')) {
            throw 'Native Croupier.dll was not installed'
          }

      - name: Assemble exact official v3.1.0 package layout
        shell: pwsh
        run: |
          $officialUrl = 'https://github.com/Deji69/Croupier/releases/download/v3.1.0/Croupier-v3.1.0.zip'
          $officialSha = '33c88d51f9c275f6aab2e09bf56e2e657a198858343a122508facb2b549802a8'
          Invoke-WebRequest -Uri $officialUrl -OutFile official-v3.1.0.zip
          $downloadedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath official-v3.1.0.zip).Hash.ToLowerInvariant()
          if ($downloadedSha -ne $officialSha) {
            throw "Official v3.1.0 package hash mismatch: $downloadedSha"
          }

          Expand-Archive -LiteralPath official-v3.1.0.zip -DestinationPath package
          $appDir = 'package/App - Install Anywhere'
          $modDll = 'package/Mod - Install to Game/Retail/mods/Croupier.dll'

          $expectedExeSha = 'ae496e0484f77be752c0b58b2e99f32baf93258e2b5d921e7a8a2e3aed1af5fc'
          $expectedAppDllSha = '34beebf94bee6af87a5c9aee9e4201f61de53c474588edfea13e45364a6280fa'
          $actualExeSha = (Get-FileHash -Algorithm SHA256 -LiteralPath "$appDir/Croupier.exe").Hash.ToLowerInvariant()
          $actualAppDllSha = (Get-FileHash -Algorithm SHA256 -LiteralPath "$appDir/Croupier.dll").Hash.ToLowerInvariant()
          if ($actualExeSha -ne $expectedExeSha -or $actualAppDllSha -ne $expectedAppDllSha) {
            throw 'Official v3.1.0 app files do not match the published release'
          }

          Copy-Item -LiteralPath 'stage/bin/Croupier.dll' -Destination $modDll -Force

          $allFiles = Get-ChildItem -LiteralPath package -Recurse -File
          if ($allFiles.Count -ne 1088) {
            throw "Unexpected package file count: $($allFiles.Count)"
          }
          $selfContainedRuntimeFiles = @('coreclr.dll', 'clrjit.dll', 'hostfxr.dll', 'System.Private.CoreLib.dll')
          $unexpectedRuntime = $allFiles | Where-Object { $_.Name -in $selfContainedRuntimeFiles }
          if ($unexpectedRuntime.Count -ne 0) {
            throw 'Self-contained .NET runtime files were unexpectedly included'
          }

          $zip = 'Croupier-v3.1.0-HITMAN-3.280-SDK4.1.0-${{ matrix.variant }}.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal

          $zipSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $modSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $modDll).Hash.ToLowerInvariant()
          $zipBytes = (Get-Item -LiteralPath $zip).Length
          $dllCount = ($allFiles | Where-Object Extension -eq '.dll').Count
          "SOURCE_COMMIT=742efac01ff26d96f337aa3fc693dd57b8f1d885"
          "OFFICIAL_APP_EXE_SHA256=$actualExeSha"
          "OFFICIAL_APP_DLL_SHA256=$actualAppDllSha"
          "PORTED_MOD_DLL_SHA256=$modSha"
          "PACKAGE_SHA256=$zipSha"
          "PACKAGE_BYTES=$zipBytes"
          "PACKAGE_FILES=$($allFiles.Count)"
          "DLL_FILES=$dllCount"

      - name: Upload friend-ready official-style package
        uses: actions/upload-artifact@v4
        with:
          name: Croupier-v3.1.0-HITMAN-3.280-SDK4.1.0-${{ matrix.variant }}
          path: Croupier-v3.1.0-HITMAN-3.280-SDK4.1.0-${{ matrix.variant }}.zip
          if-no-files-found: error
          retention-days: 7

