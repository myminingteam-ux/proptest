name: Croupier HITMAN 3.280 SDK 4.1.0

on:
  push:
    branches: [croupier-3280-sdk410]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, load-hook-disabled]
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout exact legacy Croupier base
        uses: actions/checkout@v4
        with:
          repository: Deji69/Croupier
          ref: 908ae6bf4ca209661359cd559d1f3be8e49d4c28
          path: src
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply SDK 4.1.0 compatibility patch
        shell: pwsh
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          @'
          from pathlib import Path
          import os, re

          root = Path.cwd()
          shim = root / 'compat-include'
          shim.mkdir(exist_ok=True)
          (shim / 'implot.h').write_text(
              '#pragma once\n'
              'struct ImPlotContext;\n'
              'namespace ImPlot { inline void SetCurrentContext(ImPlotContext*) noexcept {} }\n',
              encoding='ascii'
          )

          cmake = Path('src/mod/CMakeLists.txt')
          cm = cmake.read_text(encoding='utf-8-sig')
          old_sdk = 'set(ZHMMODSDK_VER "v4.0.0-rc.2")'
          if cm.count(old_sdk) != 1:
              raise SystemExit('Unexpected legacy SDK declaration')
          cm = cm.replace(old_sdk, 'set(ZHMMODSDK_VER "v4.1.0")')
          marker = 'target_compile_options(Croupier PRIVATE -utf-8)'
          if cm.count(marker) != 1:
              raise SystemExit('Unexpected Croupier compile-options marker')
          shim_path = shim.resolve().as_posix()
          cm = cm.replace(marker,
              marker + '\n'
              'target_compile_definitions(Croupier PRIVATE NOMINMAX)\n'
              f'target_include_directories(Croupier PRIVATE "{shim_path}")')
          cmake.write_text(cm, encoding='utf-8', newline='\n')

          cpp = Path('src/mod/src/Croupier.cpp')
          text = cpp.read_text(encoding='utf-8')
          replacements = [
              ('Globals::ActorManager->m_aActiveActors[i]', 'Globals::ActorManager->m_aActors[i]'),
              ('actorRef.m_ref.QueryInterface<ZRepositoryItemEntity>()', 'actorRef.m_entityRef.QueryInterface<ZRepositoryItemEntity>()'),
              ('if (!actor.m_bUnk16) continue; // m_bUnk16 = is target (and still alive)',
               'if (!actor.m_bContractTarget) continue; // SDK 4.1.0 target flag'),
              ('Functions::ZDynamicObject_ToString->Call(const_cast<ZDynamicObject*>(&obj), &res);',
               'Functions::ZDynamicObject_ToString->Call(const_cast<ZDynamicObject*>(&obj), res);'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one compatibility site, found {text.count(old)}: {old}')
              text = text.replace(old, new)

          if os.environ['BUILD_VARIANT'] == 'load-hook-disabled':
              h = Path('src/mod/src/Croupier.h')
              header = h.read_text(encoding='utf-8')
              for exact in [
                  '\tauto SendLoadStarted() -> void;\n',
                  '\tauto SendLoadFinished() -> void;\n',
                  '\tauto ProcessLoadRemoval() -> void;\n',
                  '\tDECLARE_PLUGIN_DETOUR(Croupier, void*, OnLoadingScreenActivated, void* th, void* a1);\n',
                  '\tbool loadRemovalActive = false;\n',
                  '\tbool isLoadingScreenCheckHasBeenTrue = false;\n',
                  '\tbool loadingScreenActivated = false;\n',
              ]:
                  if header.count(exact) != 1:
                      raise SystemExit(f'Expected one loading-hook header site: {exact!r}')
                  header = header.replace(exact, '')
              h.write_text(header, encoding='utf-8', newline='\n')

              text = text.replace('\tHooks::ZLoadingScreenVideo_ActivateLoadingScreen->AddDetour(this, &Croupier::OnLoadingScreenActivated);\n', '')
              text = text.replace('\tHooks::ZLoadingScreenVideo_ActivateLoadingScreen->RemoveDetour(&Croupier::OnLoadingScreenActivated);\n', '')
              text = text.replace('\tthis->ProcessLoadRemoval();\n', '')
              text, n1 = re.subn(
                  r'auto Croupier::ProcessLoadRemoval\(\) -> void \{.*?\n\}\n\nauto Croupier::ProcessMissionsMessage',
                  'auto Croupier::ProcessMissionsMessage', text, count=1, flags=re.S)
              text, n2 = re.subn(
                  r'auto Croupier::SendLoadStarted\(\) -> void \{.*?\n\}\n\nauto Croupier::SendLoadFinished\(\) -> void \{.*?\n\}\n\n',
                  '', text, count=1, flags=re.S)
              text, n3 = re.subn(
                  r'DEFINE_PLUGIN_DETOUR\(Croupier, void\*, OnLoadingScreenActivated, void\* th, void\* a1\) \{.*?\n\}\n\nDEFINE_PLUGIN_DETOUR\(Croupier, void, OnEventReceived',
                  'DEFINE_PLUGIN_DETOUR(Croupier, void, OnEventReceived', text, count=1, flags=re.S)
              if (n1, n2, n3) != (1, 1, 1):
                  raise SystemExit(f'Loading workaround incomplete: {(n1, n2, n3)}')

          cpp.write_text(text, encoding='utf-8', newline='\n')

          final = cpp.read_text(encoding='utf-8')
          forbidden = [
              'Globals::ActorManager->m_aActiveActors[i]',
              'actorRef.m_ref.QueryInterface<ZRepositoryItemEntity>()',
              'if (!actor.m_bUnk16)',
              'ZDynamicObject_ToString->Call(const_cast<ZDynamicObject*>(&obj), &res)',
          ]
          for s in forbidden:
              if s in final:
                  raise SystemExit(f'Legacy compiled expression remains: {s}')

          if os.environ['BUILD_VARIANT'] == 'load-hook-disabled':
              for s in ['OnLoadingScreenActivated', 'ProcessLoadRemoval', 'SendLoadStarted', 'SendLoadFinished']:
                  if s in final or s in Path('src/mod/src/Croupier.h').read_text(encoding='utf-8'):
                      raise SystemExit(f'Loading workaround symbol remains: {s}')
          '@ | python -

      - name: Record exact source diff
        shell: pwsh
        run: |
          Push-Location src
          git diff -- mod/CMakeLists.txt mod/src/Croupier.h mod/src/Croupier.cpp | Out-File ../COMPATIBILITY-SOURCE-DIFF.patch -Encoding utf8
          Pop-Location

      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish src/app/Croupier.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishTrimmed=false -o built-app
          if (!(Test-Path built-app/Croupier.exe)) { throw 'Croupier.exe was not produced' }

      - name: Setup MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native HITMAN mod
        shell: pwsh
        run: |
          Push-Location src/mod
          cmake --preset x64-Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build _build/x64-Release --config RelWithDebInfo --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Croupier native build failed' }
          Pop-Location
          $dll = Get-ChildItem src/mod/_build/x64-Release -Filter Croupier.dll -Recurse | Select-Object -First 1
          if (!$dll) { throw 'Croupier.dll was not produced' }
          New-Item -ItemType Directory -Force built-mod | Out-Null
          Copy-Item $dll.FullName built-mod/Croupier.dll

      - name: Assemble friend-ready ZIP
        shell: pwsh
        run: |
          $release = 'release'
          $appDir = Join-Path $release 'App - Install Anywhere'
          $modDir = Join-Path $release 'Mod - Install to Game'
          New-Item -ItemType Directory -Force $appDir,$modDir | Out-Null
          Copy-Item 'built-app/*' $appDir -Recurse -Force
          Copy-Item 'built-mod/Croupier.dll' $modDir -Force
          Copy-Item 'COMPATIBILITY-SOURCE-DIFF.patch' $release -Force

          @'
          [InternetShortcut]
          URL=https://github.com/OrfeasZ/ZHMModSDK/releases/tag/v4.1.0
          '@ | Set-Content (Join-Path $release 'ZHMModSDK-v4.1.0.url') -Encoding ascii

          @'
          CROUPIER - HITMAN 3.280 / ZHMMODSDK 4.1.0

          INSTALL
          1. Extract this ZIP somewhere outside the HITMAN folder.
          2. Install ZHMModSDK v4.1.0 if you do not already have it.
          3. Copy "Mod - Install to Game\Croupier.dll" to HITMAN3\Retail\mods\.
          4. Run "App - Install Anywhere\Croupier.exe".
          5. Start HITMAN.
          6. Run Croupier and HITMAN at the same privilege level (normally both non-admin).

          This app build is self-contained for Windows x64, so no .NET SDK or Visual Studio is required.

          BUILD VARIANT: ${{ matrix.variant }}
          BASE SOURCE: 908ae6bf4ca209661359cd559d1f3be8e49d4c28
          SDK TARGET: ZHMModSDK v4.1.0

          standard = legacy Croupier loading behavior retained.
          load-hook-disabled = old loading-screen detour/load-removal path consistently disabled,
          matching the apparent intent of the supplied post-3.280 source edit.

          Windows compilation is verified by CI. Actual in-game HITMAN 3.280 behavior still needs
          to be tested on a machine with the game installed.
          '@ | Set-Content (Join-Path $release 'START HERE.txt') -Encoding utf8

          @'
          The ZHMModSDK v4.1.0 DevPkg public plugin headers reference ImPlot context setup, while
          this legacy Croupier does not use ImPlot. The compatibility build provides the minimal
          compile-time context declarations/no-op setter needed by those headers. No Croupier
          ImPlot functionality is removed because this source version contains none.
          '@ | Set-Content (Join-Path $release 'SDK-COMPATIBILITY-NOTE.txt') -Encoding utf8

          $zip = 'Croupier-3.280-SDK4.1.0-${{ matrix.variant }}.zip'
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash (Join-Path $appDir 'Croupier.exe') -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash (Join-Path $modDir 'Croupier.dll') -Algorithm SHA256).Hash.ToLower()
          "ZIP_SHA256=$zipHash"
          "EXE_SHA256=$exeHash"
          "DLL_SHA256=$dllHash"

      - name: Upload friend-ready package
        uses: actions/upload-artifact@v4
        with:
          name: Croupier-3.280-SDK4.1.0-${{ matrix.variant }}
          path: Croupier-3.280-SDK4.1.0-${{ matrix.variant }}.zip
          if-no-files-found: error
          retention-days: 7
