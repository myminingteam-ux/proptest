name: Export Android signing tools
on:
  push:
    branches:
      - tmp/refresh-flex3-shell-build-20260829
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p android-signing-tools/lib
          cp "$BT/apksigner" android-signing-tools/
          cp "$BT/lib/apksigner.jar" android-signing-tools/lib/
          cp "$BT/zipalign" android-signing-tools/
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-linux
          path: android-signing-tools
          if-no-files-found: error
